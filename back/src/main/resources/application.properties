spring.application.name=web_mail

server.port=${PORT:8080}

#
# JDBC properties
#

spring.datasource.url=jdbc:mysql://localhost:3306/${DB}
spring.datasource.username=${DB_username}
spring.datasource.password=${DB_password}

# Set root logger to show only WARN and above
logging.level.root=Info

# Turn off noisy framework logs
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.apache=ERROR

# Enable logging for your application packages (adjust the package names to match yours)
logging.level.com.mail.back=INFO
logging.level.com.mail.back.REST=INFO

#security
jwt.secret=${JWT_SECRET}

# Format the log output for better readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Set the timezone for the application
server.time-zone=UTC

spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
# Existing installations created before Flyway are treated as the V1 baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

storage.type=local
storage.local.base-path=./uploads
storage.cloud.bucket=${S3_BUCKET:}
storage.cloud.region=${AWS_REGION:}
storage.max-file-size-mb=10
storage.allowed-extensions=jpg,jpeg,png,gif,pdf,docx,txt
storage.allowed-mime-types=image/jpeg,image/png,image/gif,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,application/octet-stream
